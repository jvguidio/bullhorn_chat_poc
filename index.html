<!DOCTYPE html>
<html>
<head>
    <title>POC - Bullhorn Embedded Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>
<body>
  <h1>POC - Bullhorn Embedded Chat</h1>
  <p>Running as Jen Can</p>

  <script type="text/javascript">
    // =========================
    // 🚨 POC ONLY — INSECURE 🚨
    // =========================

    // --- Salesforce OAuth (Username-Password grant) ---
    // Sandbox auth host for token requests
    const AUTH_HOST = 'https://test.salesforce.com';

    // Connected App (Consumer Key/Secret)
    const CONSUMER_KEY = '3MVG9EJ2FoGDnkgWnMosmLrBeJvNC8N8vLW2QewRF1CXa7AudE3Kh2vWt_gkmjCzNSU190f.wXXvBIi9D1k.R';
    const CONSUMER_SECRET = 'EBE3FB4E2E37E8EC92120573AAA81B6F7469D8E5264E6EA7A0BF3302AA42BD37'; // ⚠️ POC only

    // Sandbox user creds (POC test user).
    const SF_USERNAME = 'victor.guidio-lpl@bullhorn.com.uat';
    const SF_PASSWORD = '1708s9zn';

    const SALESFORCE_INSTANCE_URL = 'https://bullhorn--uat.sandbox.my.salesforce.com';

    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';
        embeddedservice_bootstrap.init(
          '00DU9000004ImTh',
          'Agentforce_Embedded_Deployment',
          'https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809',
          { scrt2URL: 'https://bullhorn--uat.sandbox.my.salesforce-scrt.com' }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
      }
    }

    // Get OAuth token via Username–Password grant (POC only)
    async function getAccessTokenPOC() {
      const body = new URLSearchParams({
        grant_type: 'password',
        client_id: CONSUMER_KEY,
        client_secret: CONSUMER_SECRET,
        username: SF_USERNAME,
        password: SF_PASSWORD
      });

      const res = await fetch(`${AUTH_HOST}/services/oauth2/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Token request failed: ${res.status} ${text}`);
      }
        console.log('auth response ',res.json());
      return res.json();
    }

    async function checkAgentforceAndMaybeInit(accessToken) {
      const externalId = 'BH_7066344';
      const endpointUrl = `${SALESFORCE_INSTANCE_URL}/services/apexrest/CheckAgentforceAccess/${externalId}`;

      const resp = await fetch(endpointUrl, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        }
      });

      // Endpoint returns plain text "true" or "false"
      const isAgentforce = (await resp.text()).trim().toLowerCase() === 'true';
      if (resp.ok && isAgentforce) {
        console.log('✅ Access OK. Initializing chat.');
        initEmbeddedMessaging();
      } else {
        console.log('🚫 No access or error. Chat not initialized.');
      }
    }

    // Orchestrate POC flow: fetch token silently, then check access, then maybe init chat
    async function startPocFlow() {
      try {
        const tokenData = await getAccessTokenPOC();
        console.log('Got token:', !!tokenData.access_token);
        await checkAgentforceAndMaybeInit(tokenData.access_token);
      } catch (e) {
        console.error('POC flow failed:', e);
      }
    }

    // Embedded Messaging Ready → set hidden pre-chat fields (unchanged)
    window.addEventListener('onEmbeddedMessagingReady', () => {
      try {
        embeddedservice_bootstrap.utilAPI.hideChatButton();
        if (embeddedservice_bootstrap && embeddedservice_bootstrap.prechatAPI) {
          embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            "Prechat_UserId": "0053g000001Hkv7AAC",
            "Integration_Id": "BH_7066344"
          });
        } else {
          console.error("Embedded Messaging API not initialized or unavailable.");
        }
      } catch (e) {
        console.error('Error in onEmbeddedMessagingReady:', e);
      }
    });
  </script>

  <!-- Load the Messaging bootstrap, then start the POC flow -->
  <script
    type="text/javascript"
    src="https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809/assets/js/bootstrap.min.js"
    onload="startPocFlow()">
  </script>
</body>
</html>
