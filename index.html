<!DOCTYPE html>
<html>
<head>
  <title>POC - Bullhorn Embedded Chat (Serverless Token)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <style>
  /* Wrapper that behaves like a sticky footer */
  #agentforceInlineWrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 72px;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* This is where Messaging mounts */
  #agentforceInline {
    width: 720px;
    max-width: 95%;
    height: 48px;
    border-radius: 10px;
    overflow: hidden;
  }

  /* Prevent Messaging from going fullscreen inline */
  #agentforceInline iframe {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    border-radius: 10px !important;
  }

  /* Prevent page content from being hidden behind the bar */
  body {
    padding-bottom: 90px;
  }
</style>
</head>
<body>
  <h1>POC - Bullhorn Embedded Chat</h1>
  <p>Running as Jen Can</p>
  <div id="agentforceInlineWrapper">
  <div id="agentforceInline"></div>
</div>


  <script type="text/javascript">
    const PROXY_URL = 'https://bullhorn-agentforce-proxy.vercel.app/api/check-agentforce';
    const INTEGRATION_ID = 'BH_7440523';
    const SALESFORCE_INSTANCE_URL = 'https://bullhorn--uat.sandbox.my.salesforce.com';
    let AGENTFORCE_USER_ID = null;

    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';
    
        embeddedservice_bootstrap.settings.displayMode = 'inline';
    
        // 🚨 MUST BE AN ELEMENT, NOT A STRING
        embeddedservice_bootstrap.settings.targetElement =
          document.getElementById('agentforceInline');
    
        embeddedservice_bootstrap.init(
          '00DU9000004ImTh',
          'Agentforce_Embedded_Deployment',
          'https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809',
          {
            scrt2URL: 'https://bullhorn--uat.sandbox.my.salesforce-scrt.com'
          }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging:', err);
      }
    }
    
    async function checkAgentforceAndMaybeInit() {
      try {
        // Tenta cache em sessionStorage (expira em ~60s)
        const cacheKey = `agentforce:${INTEGRATION_ID}`;
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
          const { ts, data } = JSON.parse(cached);
          if (Date.now() - ts < 60_000) {
            console.log('♻️ Using cache for auth');
            return handleAuthResponse(data);
          }
        }

        const url = `${PROXY_URL}?integrationId=${encodeURIComponent(INTEGRATION_ID)}`;
        const resp = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });

        if (!resp.ok) {
          const txt = await resp.text();
          console.error('Proxy error:', resp.status, txt);
          return;
        }

        const data = await resp.json();

        // Salva no cache (com timestamp)
        sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data }));

        handleAuthResponse(data);
      } catch (e) {
        console.error('Access check failed:', e);
      }
    }

    function handleAuthResponse(data) {
      const allowed =
        typeof data.allowed === 'boolean'
          ? data.allowed
          : (typeof data.isAgentforceUser === 'boolean' ? data.isAgentforceUser : false);

      const userId = (data && 'userId' in data) ? (data.userId ?? null) : null;
      AGENTFORCE_USER_ID = userId;

      if (allowed) {
        console.log('✅ Access OK. Initializing chat.', { userId });
        initEmbeddedMessaging();
      } else {
        console.log('🚫 Not initializing chat.', data);
      }
    }

    // Hide chat button & set hidden fields once Messaging is ready
    window.addEventListener('onEmbeddedMessagingReady', () => {
    try {
      if (embeddedservice_bootstrap?.prechatAPI) {
        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
          "Integration_Id": INTEGRATION_ID,
          "Prechat_UserId": AGENTFORCE_USER_ID
        });
      }
    } catch (e) {
      console.error('Error in onEmbeddedMessagingReady:', e);
    }
  });

  </script>

  <!-- Load Messaging bootstrap, then run the access check -->
  <script
    type="text/javascript"
    src="https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809/assets/js/bootstrap.min.js"
    onload="checkAgentforceAndMaybeInit()">
  </script>
</body>
</html>
