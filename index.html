<!DOCTYPE html>
<html>
<head>
  <title>POC - Bullhorn Embedded Chat (Hardcoded Token)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>
<body>
  <h1>POC - Bullhorn Embedded Chat</h1>
  <p>Running as Jen Can</p>

  <script type="text/javascript">
    // ===========
    // POC ONLY ⚠️
    // ===========
    // Paste a fresh access token from Postman here.
    // (It will expire—see notes below.)
    const ACCESS_TOKEN = '00DU9000004ImTh!AQEAQKH6SbOHxEn.Aa4WnBKZm.hZWjzuEkWSKFSEwDpuxVBndtcKldB.o4wN0gqHd1R7RAZdVM5qlNBHDdVRTBhSfp9hVjqI';

    // Your sandbox instance (not the login host)
    const SALESFORCE_INSTANCE_URL = 'https://bullhorn--uat.sandbox.my.salesforce.com';

    // ---- Embedded Messaging init (unchanged) ----
    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';
        embeddedservice_bootstrap.init(
          '00DU9000004ImTh',
          'Agentforce_Embedded_Deployment',
          'https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809',
          { scrt2URL: 'https://bullhorn--uat.sandbox.my.salesforce-scrt.com' }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging:', err);
      }
    }

    // ---- Access check with hardcoded token ----
    async function checkAgentforceAndMaybeInit() {
      const externalId = 'BH_7066344';
      const endpointUrl = `${SALESFORCE_INSTANCE_URL}/services/apexrest/CheckAgentforceAccess/${externalId}`;

      try {
        const resp = await fetch(endpointUrl, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${ACCESS_TOKEN}`,
            'Content-Type': 'application/json'
          }
        });

        const text = (await resp.text() || '').trim().toLowerCase();
        const isAgentforce = text === 'true';

        if (resp.status === 401) {
          console.warn('Access token likely expired/invalid (401). Replace the token and retry.');
        }

        if (resp.ok && isAgentforce) {
          console.log('✅ Access OK. Initializing chat.');
          initEmbeddedMessaging();
        } else {
          console.log(`🚫 Not initializing chat. status=${resp.status}, body="${text}"`);
        }
      } catch (e) {
        console.error('Access check failed:', e);
      }
    }

    // Hide chat button & set hidden fields once Messaging is ready
    window.addEventListener('onEmbeddedMessagingReady', () => {
      try {
        embeddedservice_bootstrap.utilAPI.hideChatButton();
        if (embeddedservice_bootstrap && embeddedservice_bootstrap.prechatAPI) {
          embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            "Prechat_UserId": "0053g000001Hkv7AAC",
            "Integration_Id": "BH_7066344"
          });
        } else {
          console.error("Embedded Messaging API not initialized or unavailable.");
        }
      } catch (e) {
        console.error('Error in onEmbeddedMessagingReady:', e);
      }
    });
  </script>

  <!-- Load Messaging bootstrap, then run the access check -->
  <script
    type="text/javascript"
    src="https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809/assets/js/bootstrap.min.js"
    onload="checkAgentforceAndMaybeInit()">
  </script>
</body>
</html>
