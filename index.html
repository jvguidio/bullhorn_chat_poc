<!DOCTYPE html>
<html lang="en">
<head>
  <title>POC - Bullhorn Embedded Chat (Serverless Token)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <style>
    /* ===== RESET / BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      color: #181818;
      padding-bottom: 90px;
    }

    /* ===================================================================
       HIDE the default Salesforce floating chat button & container
       until WE decide to show it via launchChat().
       =================================================================== */
    .embeddedServiceHelpButton,
    .embedded-service,
    .embeddedMessagingFrame,
    .embeddedMessagingConversationButtonWrapper {
      display: none !important;
    }

    /* Once we launch the chat, show the Salesforce container */
    body.chat-expanded .embeddedServiceHelpButton,
    body.chat-expanded .embedded-service,
    body.chat-expanded .embeddedMessagingFrame {
      display: block !important;
    }

    /* ===================================================================
       BOTTOM BAR  (visible in idle + minimized states)
       =================================================================== */
    #agentforceBottomBar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 9998;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* hide bottom bar when expanded */
    body.chat-expanded #agentforceBottomBar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(100%);
    }

    /* ---------- IDLE OVERLAY ---------- */
    #idleOverlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      padding: 14px 16px 16px;
      gap: 10px;
    }

    body.chat-minimized #idleOverlay { display: none; }

    .fake-input-row {
      display: flex;
      align-items: center;
      width: 720px;
      max-width: 95%;
      height: 48px;
      border: 1.5px solid #d8dde6;
      border-radius: 24px;
      padding: 0 6px 0 16px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .fake-input-row:focus-within,
    .fake-input-row:hover {
      border-color: #0176d3;
      box-shadow: 0 0 0 3px rgba(1,118,211,0.15);
    }

    .sparkle-icon {
      font-size: 18px;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .fake-input-field {
      flex: 1;
      font-size: 14px;
      color: #181818;
      border: none;
      outline: none;
      background: transparent;
      height: 100%;
    }

    .fake-input-field::placeholder {
      color: #6b7280;
    }

    .fake-send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #0176d3;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .fake-send-btn:hover { background: #014486; }

    /* suggestion chips */
    .suggestion-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 720px;
    }

    .chip {
      padding: 6px 16px;
      border: 1.5px solid #0176d3;
      border-radius: 20px;
      font-size: 13px;
      color: #0176d3;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .chip:hover {
      background: #0176d3;
      color: #fff;
    }

    /* ---------- MINIMIZED OVERLAY ---------- */
    #minimizedOverlay {
      display: none;
    }

    body.chat-minimized #minimizedOverlay {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .minimized-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 24px;
      background: linear-gradient(135deg, #0176d3 0%, #014486 100%);
      color: #fff;
      border-radius: 12px 12px 0 0;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
      transition: background 0.2s;
    }

    .minimized-bar:hover {
      background: linear-gradient(135deg, #0b8aed 0%, #0176d3 100%);
    }

    .minimized-bar .agent-icon {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .minimized-bar .return-text {
      flex: 1;
    }

    .minimized-bar .return-arrow {
      font-size: 20px;
    }

    /* ===================================================================
       PAGE CONTENT (demo placeholder)
       =================================================================== */
    .page-content {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .page-content h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .page-content p {
      font-size: 15px;
      color: #6b7280;
    }

    /* ===================================================================
       BODY OVERFLOW LOCK
       =================================================================== */
    body.chat-expanded {
      overflow: hidden;
    }
  </style>
</head>
<body class="chat-idle">

  <!-- ============ PAGE CONTENT (demo) ============ -->
  <div class="page-content">
    <h1>POC - Bullhorn Embedded Chat</h1>
    <p>Running as Jen Can</p>
  </div>

  <!-- ============ BOTTOM BAR (idle + minimized) ============ -->
  <div id="agentforceBottomBar">

    <!-- IDLE: fake input + suggestion chips -->
    <div id="idleOverlay">
      <div class="fake-input-row" id="fakeInputRow">
        <span class="sparkle-icon">&#10024;</span>
        <input type="text" class="fake-input-field" id="fakeInput" placeholder="Ask a question or request help…" autocomplete="off">
        <button class="fake-send-btn" id="fakeSendBtn" aria-label="Send">&#10148;</button>
      </div>
      <div class="suggestion-chips">
        <span class="chip" data-text="How to clear browser cache">How to clear browser cache</span>
        <span class="chip" data-text="How to reset my ATS user password">How to reset my ATS user password</span>
        <span class="chip" data-text="Connect me to a human">Connect me to a human</span>
      </div>
    </div>

    <!-- MINIMIZED: return bar -->
    <div id="minimizedOverlay">
      <div class="minimized-bar" id="returnBar">
        <span class="agent-icon">&#129302;</span>
        <span class="return-text">Return to Agentforce</span>
        <span class="return-arrow">&rarr;</span>
      </div>
    </div>
  </div>

  <!-- ============ JAVASCRIPT ============ -->
  <script type="text/javascript">
    /* ---- Config ---- */
    const PROXY_URL  = 'https://bullhorn-agentforce-proxy.vercel.app/api/check-agentforce';
    const INTEGRATION_ID = 'BH_7440523';
    const SALESFORCE_INSTANCE_URL = 'https://bullhorn--uat.sandbox.my.salesforce.com';
    let AGENTFORCE_USER_ID = null;

    /* ==================================================================
       STATE MACHINE
       ================================================================== */
    let chatState = 'idle';            // 'idle' | 'expanded' | 'minimized'
    let conversationActive = false;
    let pendingMessage = null;
    let chatLaunched = false;          // true after launchChat() has been called

    function setChatState(newState) {
      chatState = newState;
      document.body.classList.remove('chat-idle', 'chat-expanded', 'chat-minimized');
      document.body.classList.add('chat-' + newState);

      if (newState === 'expanded') {
        document.body.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
      }
    }

    /* ==================================================================
       CORE: Launch chat + auto-send message
       This follows the exact pattern from the Salesforce tutorial:
       1. Call launchChat() to open the chat session
       2. Wait 3 seconds for chat to fully initialize
       3. Call sendTextMessage() with the queued message
       ================================================================== */
    function launchChatAndSendMessage(message) {
      pendingMessage = message;
      setChatState('expanded');

      if (!chatLaunched) {
        chatLaunched = true;
        console.log('Launching chat...');

        embeddedservice_bootstrap.utilAPI.launchChat()
          .then(() => {
            console.log('Chat launched. Waiting 3s before sending message...');
            // Wait 3 seconds for the chat to fully load
            setTimeout(() => {
              if (pendingMessage) {
                const msg = pendingMessage;
                pendingMessage = null;
                embeddedservice_bootstrap.utilAPI.sendTextMessage(msg)
                  .then(() => {
                    console.log('Message sent successfully:', msg);
                  })
                  .catch((err) => {
                    console.warn('sendTextMessage failed:', err);
                  });
              }
            }, 3000);
          })
          .catch((err) => {
            console.error('launchChat failed:', err);
            chatLaunched = false;
          });
      } else {
        // Chat already launched — just send the message directly
        if (pendingMessage) {
          const msg = pendingMessage;
          pendingMessage = null;
          embeddedservice_bootstrap.utilAPI.sendTextMessage(msg)
            .then(() => {
              console.log('Message sent:', msg);
            })
            .catch((err) => {
              console.warn('sendTextMessage failed:', err);
            });
        }
      }
    }

    /* ==================================================================
       IDLE BAR INTERACTIONS
       ================================================================== */
    const fakeInput   = document.getElementById('fakeInput');
    const fakeSendBtn = document.getElementById('fakeSendBtn');

    function submitIdleInput() {
      const text = fakeInput.value.trim();
      if (!text) return;
      fakeInput.value = '';
      launchChatAndSendMessage(text);
    }

    fakeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitIdleInput();
      }
    });

    fakeSendBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      submitIdleInput();
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const text = chip.getAttribute('data-text');
        launchChatAndSendMessage(text);
      });
    });

    /* ==================================================================
       MINIMIZED BAR INTERACTION
       ================================================================== */
    document.getElementById('returnBar').addEventListener('click', () => {
      setChatState('expanded');
    });

    /* ==================================================================
       EMBEDDED MESSAGING EVENTS
       ================================================================== */
    window.addEventListener('onEmbeddedMessagingConversationStarted', () => {
      console.log('Conversation started');
      conversationActive = true;
      if (chatState !== 'expanded') {
        setChatState('expanded');
      }
    });

    window.addEventListener('onEmbeddedMessagingConversationClosed', () => {
      console.log('Conversation closed');
      conversationActive = false;
      pendingMessage = null;
      chatLaunched = false;
      setChatState('idle');
    });

    window.addEventListener('onEmbeddedMessagingReady', () => {
      console.log('Embedded Messaging ready');
      try {
        if (embeddedservice_bootstrap?.prechatAPI) {
          embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            "Integration_Id": INTEGRATION_ID,
            "Prechat_UserId": AGENTFORCE_USER_ID
          });
        }
      } catch (e) {
        console.error('Error in onEmbeddedMessagingReady:', e);
      }
    });

    /* ==================================================================
       INIT EMBEDDED MESSAGING  (floating mode)
       Uses hideChatButtonOnLoad to hide the default FAB button.
       We control the UI entirely through our custom bottom bar
       and launch the chat programmatically via launchChat().
       ================================================================== */
    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        // CRITICAL: Hide the default chat button on load.
        // We use our own custom input bar instead.
        embeddedservice_bootstrap.settings.hideChatButtonOnLoad = true;

        embeddedservice_bootstrap.init(
          '00DU9000004ImTh',
          'Agentforce_Embedded_Deployment',
          'https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809',
          { scrt2URL: 'https://bullhorn--uat.sandbox.my.salesforce-scrt.com' }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging:', err);
      }
    }

    /* ==================================================================
       AUTH / PROXY CHECK
       ================================================================== */
    async function checkAgentforceAndMaybeInit() {
      try {
        const cacheKey = 'agentforce:' + INTEGRATION_ID;
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
          const { ts, data } = JSON.parse(cached);
          if (Date.now() - ts < 60000) {
            console.log('Using cache for auth');
            return handleAuthResponse(data);
          }
        }

        const url = PROXY_URL + '?integrationId=' + encodeURIComponent(INTEGRATION_ID);
        const resp = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });

        if (!resp.ok) {
          const txt = await resp.text();
          console.error('Proxy error:', resp.status, txt);
          return;
        }

        const data = await resp.json();
        sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data }));
        handleAuthResponse(data);
      } catch (e) {
        console.error('Access check failed:', e);
      }
    }

    function handleAuthResponse(data) {
      const allowed =
        typeof data.allowed === 'boolean'
          ? data.allowed
          : (typeof data.isAgentforceUser === 'boolean' ? data.isAgentforceUser : false);

      const userId = (data && 'userId' in data) ? (data.userId ?? null) : null;
      AGENTFORCE_USER_ID = userId;

      if (allowed) {
        console.log('Access OK. Initializing Embedded Messaging.', { userId });
        initEmbeddedMessaging();
      } else {
        console.log('Not allowed for chat.', data);
      }
    }
  </script>

  <!-- Load Messaging bootstrap, then run the access check -->
  <script
    type="text/javascript"
    src="https://bullhorn--uat.sandbox.my.site.com/ESWAgentforceEmbeddedDe1742299117809/assets/js/bootstrap.min.js"
    onload="checkAgentforceAndMaybeInit()">
  </script>
</body>
</html>
